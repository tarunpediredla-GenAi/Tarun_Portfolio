    <radialGradient id="cyan-glow-right" cx="1050" cy="400" r="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Panel Gradients -->
