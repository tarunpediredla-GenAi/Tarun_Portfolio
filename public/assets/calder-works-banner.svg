      <rect x="12" y="86" width="464" height="22" rx="4" fill="#10B981" fill-opacity="0.16"/>
      <text x="20" y="101" fill="#6EE7B7" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5">+  if db.get_student_by_roll(roll_number):</text>
