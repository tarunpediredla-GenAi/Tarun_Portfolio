<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="pd-bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09111B"/>
      <stop offset="50%" stop-color="#0F1B2B"/>
      <stop offset="100%" stop-color="#081019"/>
    </linearGradient>
