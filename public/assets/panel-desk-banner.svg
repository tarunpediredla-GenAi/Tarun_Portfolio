      <text x="195" y="71" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8.5">Local Cache</text>

      <text x="256" y="63" fill="#2DD4BF" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" font-weight="700">→</text>

