      <text x="430" y="131" text-anchor="middle" fill="#CBD5E1" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="600">
        SIMPLIFY / EXAMPLE
      </text>
    </g>

    <!-- Strict Refusal Guardrail Callout -->
