      <text x="28" y="68" fill="#92400E" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="700">
        I88. Explain Django QuerySet lazy evaluation &amp; caching.
      </text>
      <text x="28" y="90" fill="#1E293B" font-family="'DM Sans', system-ui, sans-serif" font-size="11.5">
        A QuerySet can be constructed, filtered, sliced, and passed around
      </text>
      <text x="28" y="108" fill="#1E293B" font-family="'DM Sans', system-ui, sans-serif" font-size="11.5">
