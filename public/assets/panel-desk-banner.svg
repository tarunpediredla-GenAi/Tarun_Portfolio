    <!-- User Voice Question Bubble -->
    <g transform="translate(76, 68)">
      <rect width="462" height="66" rx="14" fill="#0C4A6E" fill-opacity="0.55" stroke="#38BDF8" stroke-opacity="0.55"/>
      <text x="18" y="24" fill="#7DD3FC" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="700">
        VOICE INPUT · WEB SPEECH API
      </text>
      <text x="18" y="47" fill="#F8FAFC" font-family="'DM Sans', system-ui, sans-serif" font-size="13" font-weight="500">
        "How does Django QuerySet lazy evaluation work in production?"
      </text>
    </g>

    <!-- Grounded Spoken-English Assistant Answer -->
    <g transform="translate(22, 152)">
      <rect width="516" height="160" rx="14" fill="#0B1726" stroke="#2DD4BF" stroke-opacity="0.48"/>
      <text x="18" y="26" fill="#5EEAD4" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="700">
        SPOKEN-ENGLISH ANSWER · MATCHED PASSAGE I88
      </text>
      <text x="18" y="52" fill="#E2E8F0" font-family="'DM Sans', system-ui, sans-serif" font-size="12.5">
        Django QuerySets are lazy, meaning creating or chaining filters does not
      </text>
      <text x="18" y="72" fill="#E2E8F0" font-family="'DM Sans', system-ui, sans-serif" font-size="12.5">
        hit the database immediately. SQL executes only when you evaluate the
      </text>
      <text x="18" y="92" fill="#E2E8F0" font-family="'DM Sans', system-ui, sans-serif" font-size="12.5">
        QuerySet—such as iterating, slicing, calling list(), or counting rows.
      </text>

      <!-- Citation Pill + TTS Pill -->
      <rect x="18" y="112" width="184" height="30" rx="15" fill="#115E59" fill-opacity="0.65" stroke="#2DD4BF" stroke-width="1"/>
      <text x="110" y="131" text-anchor="middle" fill="#CCFBF1" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" font-weight="700">
        OPEN CITATION · I88 · P.71
      </text>

      <rect x="214" y="112" width="136" height="30" rx="15" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.6" stroke-width="1"/>
      <text x="282" y="131" text-anchor="middle" fill="#BAE6FD" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" font-weight="700">
        SPEAK TTS AUDIO
